name: Generate snake

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Generate the snake from the contribution graph
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake-light.svg?color_snake=#C26A35&color_dots=#EBEEF2,#C6DAF7,#8DB5EE,#4D86DB,#1F5FBF
            dist/snake-dark.svg?palette=github-dark&color_snake=#E39A64&color_dots=#161B22,#12294A,#1B4A8A,#2F6FD0,#79AEFF

      - name: Publish to the output branch
        uses: crazy-max/ghaction-github-pages@v5
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
